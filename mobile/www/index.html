<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DeadlineIQ</title>
  <style>
    /* Offline fallback — shown only if the remote app can't be reached. */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020617;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
    }
    .wrap { padding: 32px; }
    .logo { font-size: 28px; font-weight: 700; color: #f1f5f9; letter-spacing: -0.3px; }
    .logo span { color: #3b82f6; }
    p { font-size: 14px; line-height: 1.6; max-width: 280px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Deadline<span>IQ</span></div>
    <p>You appear to be offline. Connect to the internet and reopen the app.</p>
  </div>
</body>
</html>
