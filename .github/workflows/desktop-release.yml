# Builds DeadlineIQ desktop installers for macOS (.dmg), Windows (.exe),
# and Linux (.AppImage).
#
# - Push a tag like v1.0.0 → builds and publishes the installers to a
#   draft GitHub Release for that tag (review, then publish the release).
# - Run manually (workflow_dispatch) → builds and uploads the installers
#   as workflow artifacts without creating a release.
#
# Unsigned builds work out of the box. For signed builds add the
# electron-builder code-signing secrets (CSC_LINK / CSC_KEY_PASSWORD,
# and notarization credentials for macOS).

name: Desktop installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and publish to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build without publishing (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: npx electron-builder --publish never

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deadlineiq-desktop-${{ runner.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          if-no-files-found: error
